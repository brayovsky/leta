name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please don't include API keys, tokens, phone numbers or customer data.
        For security issues, follow SECURITY.md instead of opening an issue.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - server / webhook
        - assistant (LLM)
        - checkout
        - portal
        - agent-console
        - dev-client
        - leta-site
        - setup / docs
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `yarn dev` and `yarn dev:wa`
        2. Pick the Westlands location
        3. Send "2 litres of milk"
        4. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Server output, browser console errors or screenshots.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Node 22.12, Chrome 140
